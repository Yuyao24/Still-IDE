name: Build Still

# Builds installers on GitHub's machines, so nothing has to be compiled on your PC.
# - Every push to main: the installers are attached, as plain files, to the "Latest build"
#   pre-release on the repository's Releases page (one click downloads Still_x.y.z_x64-setup.exe).
# - Every run also keeps a copy under the run's "Artifacts" (GitHub zips those; inside is just the installer).
# - Pushing a tag like v0.4.0: installers are also attached to a draft GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            bundles: nsis
          - name: macOS
            platform: macos-latest
            bundles: app,dmg
          - name: Linux
            platform: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Still {0}', github.ref_name) || '' }}
          releaseBody: Download the installer for your system below. See INSTALL.md for details.
          releaseDraft: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Still-${{ matrix.name }}
          if-no-files-found: error
          # Only the installer files, so the zip holds them directly with no folders.
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Publish to the "Latest build" release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${{ runner.os }}" = "Windows" ]; then files+=(uninstall/uninstall.ps1); fi
          if [ "${{ runner.os }}" != "Windows" ]; then files+=(uninstall/uninstall.sh); fi
          # Point the "latest" tag at this commit (all three jobs agree on the same commit).
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest || true
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" \
            --notes "Built automatically from the newest commit on main. Download the file for your system below: Windows Still_..._x64-setup.exe, macOS .dmg, Linux .deb or .AppImage." || true
          # Remove this system's older files (they carry the old version in their name), then upload.
          for name in $(gh release view latest --json assets -q '.assets[].name'); do
            case "$name" in
              *.exe|uninstall.ps1) [ "${{ runner.os }}" = "Windows" ] && gh release delete-asset latest "$name" -y || true ;;
              *.dmg) [ "${{ runner.os }}" = "macOS" ] && gh release delete-asset latest "$name" -y || true ;;
              *.deb|*.AppImage) [ "${{ runner.os }}" = "Linux" ] && gh release delete-asset latest "$name" -y || true ;;
            esac
          done
          gh release upload latest "${files[@]}" --clobber
