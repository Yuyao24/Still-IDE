[package]
name = "still-ide"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
ureq = { version = "3", features = ["json"] }
regex = "1"
trash = "5"
shell-words = "1"
base64 = "0.22"
